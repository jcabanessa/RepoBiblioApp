<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Libros</title>
</head>
<body>
<h1>Gestión de Libros</h1>

<!-- Botón para ir al formulario de creación -->
<a th:href="@{/libros/new}">+ Nuevo Libro</a>
<br><br>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Título</th>
    <th>Autor</th>
    <th>ISBN</th>
    <th>Cantidad</th>
    <th>Acciones</th>
  </tr>
  </thead>
  <tbody>
  <!-- Bucle para recorrer la lista de libros enviada desde el controlador -->
  <tr th:each="libro : ${libros}">
    <td th:text="${libro.libroId}">1</td>
    <td th:text="${libro.titulo}">Título de ejemplo</td>
    <td th:text="${libro.autor}">Autor de ejemplo</td>
    <td th:text="${libro.isbn}">ISBN</td>
    <td th:text="${libro.cantidad}">0</td>
    <td>
      <!-- Enlace para editar -->
      <a th:href="@{/libros/edit/{id}(id=${libro.libroId})}">Editar</a> |
      <!-- Enlace para eliminar -->
      <a th:href="@{/libros/delete/{id}(id=${libro.libroId})}" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
    </td>
  </tr>
  </tbody>
</table>

<br>
<a th:href="@{/}">Volver al inicio</a>
</body>
</html>
