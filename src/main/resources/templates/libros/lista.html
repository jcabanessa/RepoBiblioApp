<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. Cargamos el fragmento del head (Bootstrap y título) -->
<head th:replace="~{fragmentos :: cabecera('Lista de Libros')}"></head>

<!-- Añadimos un fondo ligeramente gris (bg-light) para que la tabla blanca destaque más -->
<body class="fondo-biblioteca-gestion">

<!-- 2. Inyectamos la barra de navegación superior -->
<div th:replace="~{fragmentos :: menu-superior}"></div>

<!-- 3. Contenedor principal de la página -->
<div class="container mt-4">

  <h1 class="mb-4">Gestión de Libros</h1>

  <!-- Botón para crear un nuevo libro -->
  <a th:href="@{/libros/new}" class="btn btn-primary mb-3 shadow-sm">+ Nuevo Libro</a>

  <!-- Tabla con diseño Bootstrap y fondo blanco -->
  <div class="table-responsive shadow-sm">
    <table class="table table-bordered table-striped table-hover mb-0 bg-white">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Cantidad</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="libro : ${libros}">
        <td th:text="${libro.libroId}">1</td>
        <td th:text="${libro.titulo}">Título de ejemplo</td>
        <td th:text="${libro.autor}">Autor de ejemplo</td>
        <td th:text="${libro.isbn}">ISBN</td>
        <td th:text="${libro.cantidad}">0</td>
        <td>
          <!-- Botones de acción -->
          <a th:href="@{/libros/edit/{id}(id=${libro.libroId})}" class="btn btn-warning btn-sm">Editar</a>
          <a th:href="@{/libros/delete/{id}(id=${libro.libroId})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este libro?')">Eliminar</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
