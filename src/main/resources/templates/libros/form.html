<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. Cargamos el fragmento del head (El título cambia dinámicamente si es nuevo o editar) -->
<head th:replace="~{fragmentos :: cabecera(${libro.libroId} != 0 ? 'Editar Libro' : 'Nuevo Libro')}"></head>

<!-- Fondo gris claro para que la tarjeta blanca resalte -->
<body class="bg-light">

<!-- 2. Inyectamos la barra de navegación superior -->
<div th:replace="~{fragmentos :: menu-superior}"></div>

<!-- 3. Contenedor principal de la página -->
<div class="container mt-5">

    <!-- Centramos la tarjeta y limitamos su ancho con col-md-6 -->
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="mb-4 text-center" th:text="${libro.libroId} != 0 ? 'Editar Libro' : 'Nuevo Libro'">Formulario</h1>

            <!-- Tarjeta blanca con sombra suave y sin borde -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Formulario que envía los datos al controlador POST /libros -->
                    <form th:action="@{/libros}" th:object="${libro}" method="post">

                        <!-- Campo oculto imprescindible para que Spring sepa qué ID está editando -->
                        <input type="hidden" th:field="*{libroId}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Título:</label>
                            <input type="text" class="form-control" th:field="*{titulo}" placeholder="Ej. El Señor de los Anillos" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Autor:</label>
                            <input type="text" class="form-control" th:field="*{autor}" placeholder="Ej. J.R.R. Tolkien" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">ISBN:</label>
                            <input type="text" class="form-control" th:field="*{isbn}" placeholder="Ej. 978-84-450-7140-5" />
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Cantidad disponible:</label>
                            <input type="number" class="form-control" th:field="*{cantidad}" min="0" value="1" />
                        </div>

                        <!-- Botones de acción alineados a los extremos (flexbox) -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/libros}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Libro</button>
                        </div>

                    </form>

                </div>
            </div> <!-- Fin de la tarjeta -->

        </div>
    </div>

</div>

</body>
</html>
