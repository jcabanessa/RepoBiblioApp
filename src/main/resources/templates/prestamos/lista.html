<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Préstamos')}"></head>
<body class="fondo-biblioteca-gestion">
<div th:replace="~{fragmentos :: menu-superior}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2 page-title mb-0">Administración de préstamos</h1>
        <a th:href="@{/admin/prestamos/new}" class="btn btn-primary">+ Nuevo préstamo</a>
    </div>

    <div th:if="${param.saved}" class="alert alert-success">Préstamo guardado correctamente.</div>
    <div th:if="${param.deleted}" class="alert alert-success">Préstamo eliminado correctamente.</div>

    <div class="table-wrap">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr><th>ID</th><th>Libro</th><th>Usuario</th><th>Inicio</th><th>Devolución</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="prestamo : ${prestamos}">
                    <td th:text="${prestamo.prestamoId}"></td>
                    <td th:text="${prestamo.libro.titulo}"></td>
                    <td th:text="${prestamo.usuario.nombre + ' ' + prestamo.usuario.apellidos}"></td>
                    <td th:text="${prestamo.fechaPrestamo}"></td>
                    <td th:text="${prestamo.fechaDevolucion}"></td>
                    <td th:text="${prestamo.estado}"></td>
                    <td>
                        <a th:href="@{/admin/prestamos/edit/{id}(id=${prestamo.prestamoId})}" class="btn btn-warning btn-sm">Editar</a>
                        <form th:action="@{/admin/prestamos/delete/{id}(id=${prestamo.prestamoId})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este préstamo?');">
                            <button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
