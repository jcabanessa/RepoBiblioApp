<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. Cargamos el fragmento del head -->
<head th:replace="~{fragmentos :: cabecera('Lista de Préstamos')}"></head>

<body class="fondo-biblioteca-gestion">

<!-- 2. Inyectamos la barra de navegación superior -->
<div th:replace="~{fragmentos :: menu-superior}"></div>

<!-- 3. Contenedor principal -->
<div class="container mt-4">

    <h1 class="mb-4">Gestión de Préstamos</h1>

    <!-- Botón para registrar un nuevo préstamo -->
    <a th:href="@{/prestamos/new}" class="btn btn-primary mb-3 shadow-sm">+ Nuevo Préstamo</a>

    <!-- Tabla interactiva -->
    <div class="table-responsive shadow-sm">
        <table class="table table-bordered table-striped table-hover mb-0 bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Libro Prestado</th>
                <th>Usuario</th>
                <th>Fecha Préstamo</th>
                <th>Fecha Devolución</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- Recorremos la lista enviada por el controlador -->
            <tr th:each="prestamo : ${prestamos}">
                <td th:text="${prestamo.prestamoId}">1</td>

                <!-- MAGIA DE THYMELEAF: Navegamos dentro del objeto libro y del objeto usuario -->
                <td th:text="${prestamo.libro.titulo}">Título del Libro</td>
                <td th:text="${prestamo.usuario.nombre + ' ' + prestamo.usuario.apellidos}">Nombre del Usuario</td>

                <td th:text="${prestamo.fechaPrestamo}">2026-10-20</td>
                <td th:text="${prestamo.fechaDevolucion}">2026-10-30</td>

                <td>
                    <!-- Botones de acción apuntando a las rutas de préstamos -->
                    <a th:href="@{/prestamos/edit/{id}(id=${prestamo.prestamoId})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/prestamos/delete/{id}(id=${prestamo.prestamoId})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de registrar la devolución / eliminar este préstamo?')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
