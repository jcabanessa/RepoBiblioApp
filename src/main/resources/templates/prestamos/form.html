<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<!-- Cargamos la cabecera dinámica -->
<head th:replace="~{fragmentos :: cabecera(${prestamo.prestamoId} != null and ${prestamo.prestamoId} != 0 ? 'Editar Préstamo' : 'Nuevo Préstamo')}"></head>

<body class="fondo-biblioteca-gestion">

<!-- Inyectamos el menú de navegación -->
<div th:replace="~{fragmentos :: menu-superior}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <h1 class="mb-4 text-center" th:text="${prestamo.prestamoId} != null and ${prestamo.prestamoId} != 0 ? 'Editar Préstamo' : 'Nuevo Préstamo'">Formulario de Préstamo</h1>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <form th:action="@{/admin/prestamos}" th:object="${prestamo}" method="post">

                        <input type="hidden" th:field="*{prestamoId}" />

                        <!-- Selector desplegable para el Libro -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Libro prestado:</label>
                            <select class="form-select" th:field="*{libro.libroId}" required>
                                <option value="" disabled selected>-- Selecciona un libro del catálogo --</option>
                                <option th:each="lib : ${libros}"
                                        th:value="${lib.libroId}"
                                        th:text="${lib.titulo + ' (' + lib.autor + ')'}">
                                </option>
                            </select>
                        </div>

                        <!-- Selector desplegable para el Usuario -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Usuario que lo retira:</label>
                            <select class="form-select" th:field="*{usuario.usuarioId}" required>
                                <option value="" disabled selected>-- Selecciona un usuario registrado --</option>
                                <option th:each="user : ${usuarios}"
                                        th:value="${user.usuarioId}"
                                        th:text="${user.nombre + ' ' + user.apellidos}">
                                </option>
                            </select>
                        </div>

                        <!-- Las fechas puestas en dos columnas para ahorrar espacio vertical -->
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Fecha de Préstamo:</label>
                                <!-- type="date" invoca el calendario nativo del navegador -->
                                <input type="date" class="form-control" th:field="*{fechaPrestamo}" required />
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Fecha de Devolución:</label>
                                <input type="date" class="form-control" th:field="*{fechaDevolucion}" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Estado del Préstamo:</label>
                            <select class="form-select" th:field="*{estado}" required>
                                <option value="Activo">Activo</option>
                                <option value="Devuelto">Devuelto</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/prestamos}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Préstamo</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
