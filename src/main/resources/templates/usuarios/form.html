<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Cargamos la cabecera dinámica -->
<head th:replace="~{fragmentos :: cabecera(${usuario.usuarioId} != null and ${usuario.usuarioId} != 0 ? 'Editar Usuario' : 'Nuevo Usuario')}"></head>

<body class="fondo-biblioteca-gestion">

<!-- Inyectamos el menú de navegación -->
<div th:replace="~{fragmentos :: menu-superior}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- Volvemos al ancho col-md-6 porque este formulario es más sencillo que el de préstamos -->
        <div class="col-md-6">

            <h1 class="mb-4 text-center" th:text="${usuario.usuarioId} != null and ${usuario.usuarioId} != 0 ? 'Editar Usuario' : 'Nuevo Usuario'">Formulario de Usuario</h1>
            <!-- Alerta de Error (si intenta cambiar el correo u ocurre algo) -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Mensaje de error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Alerta de Éxito -->
            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${exito}">Mensaje de éxito</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Formulario apuntando al controlador POST /usuarios -->
                    <form th:action="${esPerfil != null && esPerfil} ? @{/usuarios/perfil} : (${usuario.usuarioId == null} ? @{/usuarios/registro} : @{/admin/usuarios})" th:object="${usuario}" method="post">

                        <input type="hidden" th:field="*{usuarioId}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre:</label>
                            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Alejandro" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Apellidos:</label>
                            <input type="text" class="form-control" th:field="*{apellidos}" placeholder="Ej. Palomanes Gallego" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico:</label>
                            <!-- type="email" fuerza la validación del formato correo en el navegador -->
                            <input type="email" class="form-control" th:field="*{email}" placeholder="ejemplo@correo.com" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Teléfono:</label>
                            <!-- type="tel" despliega el teclado numérico si alguien abre la app en el móvil -->
                            <input type="tel" class="form-control" th:field="*{telefono}" placeholder="Ej. 600123456" />
                        </div>

                        <!-- 1. SI ES EL PERFIL PERSONAL: Mostramos el rol en modo solo lectura -->
                        <div class="mb-3" th:if="${esPerfil != null && esPerfil}">
                            <label class="form-label fw-bold">Rol:</label>
                            <input type="text" class="form-control" th:field="*{rol}" readonly style="background-color: #e9ecef;" />
                        </div>

                        <!-- 2. SI ES EL PANEL DE ADMIN: Mostramos el selector para elegir USER o ADMIN -->
                        <div class="mb-3" th:if="${esPerfil == null}">
                            <label class="form-label fw-bold">Rol:</label>
                            <select class="form-select" th:field="*{rol}">
                                <option value="USER">USER (Usuario Estándar)</option>
                                <option value="ADMIN">ADMIN (Administrador)</option>
                            </select>
                        </div>

                        <!-- 3. SI ES REGISTRO PÚBLICO: Enviamos el rol USER de forma oculta y automática -->
                        <input type="hidden" th:if="${esPerfil != null && !esPerfil}" th:field="*{rol}" value="USER" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña:</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" />
                            <div class="form-text text-muted">Deja en blanco si no deseas cambiar la contraseña al editar.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <!-- El botón cancelar redirige al inicio si es perfil, o al panel de admin si gestiona un administrador -->
                            <a th:href="${esPerfil != null && esPerfil} ? @{/} : @{/admin/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Usuario</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
