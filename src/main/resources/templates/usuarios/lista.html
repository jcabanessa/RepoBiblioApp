<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Cargamos el fragmento de la cabecera con el título de la página -->
<head th:replace="~{fragmentos :: cabecera('Lista de Usuarios')}"></head>

<body class="fondo-biblioteca-gestion">

<!-- Inyectamos el menú de navegación superior -->
<div th:replace="~{fragmentos :: menu-superior}"></div>

<div class="container mt-4">

    <h1 class="mb-4">Gestión de Usuarios</h1>

    <!-- Botón para añadir un nuevo usuario -->
    <a th:href="@{/usuarios/new}" class="btn btn-primary mb-3 shadow-sm">+ Nuevo Usuario</a>

    <!-- Tabla de usuarios con diseño Bootstrap -->
    <div class="table-responsive shadow-sm">
        <table class="table table-bordered table-striped table-hover mb-0 bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Correo Electrónico</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.usuarioId}">1</td>
                <td th:text="${usuario.nombre}">Alejandro</td>
                <td th:text="${usuario.apellidos}">Palomanes Gallego</td>
                <td th:text="${usuario.email}">ejemplo@correo.com</td>
                <td th:text="${usuario.telefono}">600123456</td>
                <td>
                    <!-- Enlaces de acción que apuntan al controlador de usuarios -->
                    <a th:href="@{/usuarios/edit/{id}(id=${usuario.usuarioId})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/usuarios/delete/{id}(id=${usuario.usuarioId})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este usuario? Si tiene préstamos activos podría generar un error.')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
