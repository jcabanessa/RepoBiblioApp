<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
</head>
<body>
<h1>Gestión de Usuarios</h1>

<a th:href="@{/usuarios/new}">+ Nuevo Usuario</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Fecha de Registro</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.usuarioId}">1</td>
        <td th:text="${usuario.nombre}">Nombre de ejemplo</td>
        <td th:text="${usuario.email}">ejemplo@email.com</td>
        <td th:text="${usuario.telefono}">600000000</td>
        <td th:text="${#dates.format(usuario.fechaRegistro, 'dd/MM/yyyy')}">01/01/2026</td>
        <td>
            <a th:href="@{/usuarios/edit/{id}(id=${usuario.usuarioId})}">Editar</a> |
            <a th:href="@{/usuarios/delete/{id}(id=${usuario.usuarioId})}" onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/}">Volver al inicio</a>
</body>
</html>
