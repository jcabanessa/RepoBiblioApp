<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecera (titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Spring Library</title>
    <!-- Enlace a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body.fondo-biblioteca {
            position: relative;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        body.fondo-biblioteca::before {
            content: "";
            position: fixed;
            top: -10px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            background-image: url('/img/006-library-biblioteca-angelica-a-roma_0002.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(1px) brightness(0.75);
            z-index: -1;
        }

        body.fondo-biblioteca-gestion {
            position: relative;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        body.fondo-biblioteca-gestion::before {
            content: "";
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url('/img/006-library-biblioteca-angelica-a-roma_0002.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(4.5px) brightness(0.65);
            z-index: -1;
        }

        .contenido-principal {
            position: relative;
            z-index: 1;
        }

        .text-shadow {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

<!-- Barra de navegación superior -->
<nav th:fragment="menu-superior" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="/"
           style="color: #ced4da; font-family: 'Georgia', 'Garamond', 'Times New Roman', serif; font-size: 1.35rem; letter-spacing: 0.5px;">
            📖 Spring Library App
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/libros}">Libros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/prestamos}">Préstamos</a>
                </li>

                <!-- Si NO está autenticado: Mostrar botón de Login -->
                <li class="nav-item ms-lg-3" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">Iniciar Sesión</a>
                    <a class="btn btn-light btn-sm px-3 text-dark fw-semibold" th:href="@{/usuarios/new}">Registrarse</a>
                </li>

                <!-- Si SÍ está autenticado: Mostrar Nombre y Botón de Cerrar Sesión directamente -->
                <li class="nav-item ms-lg-3 d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                    <span class="text-light">👤 <span sec:authentication="name">Usuario</span></span>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cerrar Sesión</button>
                    </form>
                </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Bootstrap JS Bundle (necesario para que funcionen los dropdowns de Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
