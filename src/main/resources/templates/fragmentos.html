<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<!-- th: fragment es un atributo para poder llamarlo luego -->
<head th:fragment="cabecera (titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- titulo dinamico--->
        <title th:text="${titulo}">Spring Library</title>
        <!-- Enlace a bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- barra de navegación superior -->
<nav th:fragment="menu-superior" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <!-- Título / Logo que lleva al inicio -->
        <a class="navbar-brand fw-bold" th:href="@{/}">📚 Spring Library App</a>

        <div class="collapse navbar-collapse">
            <!-- ms-auto empuja los enlaces hacia la derecha -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/libros}">Libros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/prestamos}">Préstamos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
