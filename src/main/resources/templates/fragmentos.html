<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Spring Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="menu-superior" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">📖 Spring Library</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" th:if="${autenticado}">
                    <a class="nav-link" th:href="@{/libros}">Libros</a>
                </li>
                <li class="nav-item" th:if="${autenticado and !esAdmin}">
                    <a class="nav-link" th:href="@{/user/prestamos}">Mis préstamos</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/prestamos}">Préstamos</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-text small" th:if="${autenticado}" th:text="${emailActual}"></span>
                <a th:if="${!autenticado}" class="btn btn-outline-light btn-sm" th:href="@{/login}">Iniciar sesión</a>
                <a th:if="${!autenticado}" class="btn btn-primary btn-sm" th:href="@{/register}">Registrarse</a>
                <a th:if="${autenticado and !esAdmin}" class="btn btn-outline-info btn-sm" th:href="@{/user}">Mi área</a>
                <form th:if="${autenticado}" th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
