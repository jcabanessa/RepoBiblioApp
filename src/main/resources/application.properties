spring.application.name=BiblioApp

# Evita conflictos con otros proyectos locales que ya usan 8080.
server.port=${SERVER_PORT:8090}

# Entorno local: MySQL del compose se publica en 3310.
# En Docker Compose estas variables se sustituyen para conectar por la red interna al servicio mysql:3306.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/biblio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:biblio}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# No se usa data.sql; los datos de demostración se cargan de forma controlada desde DataLoader.
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false
