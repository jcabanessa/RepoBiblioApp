spring.application.name=BiblioApp
# Conexión a la base de datos MySQL (ajusta el puerto si usas otro, ej. 3307)
spring.datasource.url=jdbc:mysql://localhost:3306/biblio_db?useSSL=false&serverTimezone=Madrid/Europe
spring.datasource.username=Jordi
spring.datasource.password=1234user
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
