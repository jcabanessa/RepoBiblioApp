services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: biblio_db
      MYSQL_USER: biblio
      MYSQL_PASSWORD: biblio
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - biblio_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubiblio", "-pbiblio"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/biblio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
      SPRING_DATASOURCE_USERNAME: biblio
      SPRING_DATASOURCE_PASSWORD: biblio
    ports:
      - "8090:8080"

volumes:
  biblio_mysql_data:
