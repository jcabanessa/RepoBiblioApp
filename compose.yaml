services:
  mysql:
    image: 'mysql:latest'
    container_name: 'biblioteca_mysql'
    restart: always
    environment:
      - 'MYSQL_DATABASE=biblioteca_db'
      - 'MYSQL_USER=biblioteca_user'
      - 'MYSQL_PASSWORD=biblioteca_pass'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: